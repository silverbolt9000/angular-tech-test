<div class="cart-page">
  <mat-card class="cart-card">
    <div class="cart-header">
      <div>
        <h1>Signals Cart</h1>

        <p>
          Exemplo utilizando Angular
          Signals e computed().
        </p>
      </div>

      <button mat-flat-button color="primary" (click)="addItem()">
        <mat-icon>
          add_shopping_cart
        </mat-icon>

        Adicionar item
      </button>
    </div>

    <div class="cart-items">
      @for (
      item of items();
      track item.id
      ) {
      <div class="cart-item">
        <div class="cart-item__info">
          <h3>
            {{ item.nome }}
          </h3>

          <span>
            Quantidade:
            {{ item.quantidade }}
          </span>
        </div>

        <div class="cart-item__actions">
          <strong>
            {{
            item.preco *
            item.quantidade
            | currency:'BRL'
            }}
          </strong>

          <button mat-icon-button color="warn" (click)="removeItem(item.id)">
            <mat-icon>
              delete
            </mat-icon>
          </button>
        </div>
      </div>
      }
    </div>

    <div class="cart-total">
      <span>Total</span>

      <strong>
        {{
        total()
        | currency:'BRL'
        }}
      </strong>
    </div>
  </mat-card>
</div>
